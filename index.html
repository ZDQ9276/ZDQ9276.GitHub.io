<script>
(function() {
  if (localStorage.getItem('theme') === 'eye') {
    document.body.classList.add('theme-eye');
  }
})();
function toggleTheme() {
  var btn = document.querySelector('.theme-toggle span:last-child');
  if (document.body.classList.toggle('theme-eye')) {
    localStorage.setItem('theme', 'eye');
    btn.textContent = '日常';
  } else {
    localStorage.setItem('theme', 'day');
    btn.textContent = '护眼';
  }
}
</script>
