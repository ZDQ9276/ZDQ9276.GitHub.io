<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关于我 - 我的博客</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="nav-home" href="index.html">我的博客</a>
    <div class="nav-links">
      <a href="index.html">首页</a>
      <a href="about.html">关于</a>
      <button class="theme-toggle" onclick="toggleTheme()">
        <span class="icon">&#9788;</span><span>护眼</span>
      </button>
    </div>
  </div>
</nav>

<main>
  <h1 class="page-title">关于我</h1>

  <div class="about-section">
    <h2>我是谁</h2>
    <p>
      你好！欢迎来到我的个人博客。这里是我记录学习、生活与思考的地方。
    </p>
  </div>

  <div class="about-section">
    <h2>这个博客</h2>
    <p>
      我建这个博客是为了记录自己的成长过程。无论是学到了新技术，读了一本好书，还是有了新的感悟，我都会在这里写下来。
    </p>
    <p>
      如果你偶然发现了这里，希望我的文字能给你带来一些帮助或启发。
    </p>
  </div>

  <div class="about-section">
    <h2>联系我</h2>
    <p>
      暂时还没有公开联系方式，以后会补上。
    </p>
  </div>
</main>

<footer>
  &copy; 2026 我的博客 &middot; Powered by HTML &amp; CSS
</footer>

<script>
(function() {
  if (localStorage.getItem('theme') === 'eye') {
    document.body.classList.add('theme-eye');
  }
})();
function toggleTheme() {
  var btn = document.querySelector('.theme-toggle span:last-child');
  if (document.body.classList.toggle('theme-eye')) {
    localStorage.setItem('theme', 'eye');
    btn.textContent = '日常';
  } else {
    localStorage.setItem('theme', 'day');
    btn.textContent = '护眼';
  }
}
</script>
</body>
</html>
